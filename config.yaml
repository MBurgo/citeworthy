locale:
  gl: au
  hl: en
  location: "Australia"

our_domain: fool.com.au

serp:
  provider: serpapi
  top_n: 10

chunking:
  min_words: 200
  max_words: 400
  max_chunks_per_url: 6

judge:
  model: claude-haiku-4-5-20251001
  temperature: 0.3
  samples_per_order: 2
  show_domains: true
  max_concurrency: 8

editor:
  model: claude-sonnet-4-6
  variants: 4
  max_iterations: 3

tournament:
  round_robin_max: 14
  bootstrap_resamples: 200

truth:
  samples_per_engine: 10
  engines: [perplexity, gemini_grounded]

budget:
  max_usd_per_rank_run: 2.00        # hard stop; abort run if exceeded
  max_usd_per_track_run: 3.00

# Editable price table (USD per 1M tokens). API prices change — keep current.
# Cost estimation reads from here; see §8/§11 of CITEWORTHY_SPEC.md.
pricing:
  claude-haiku-4-5-20251001:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  claude-sonnet-4-6:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
